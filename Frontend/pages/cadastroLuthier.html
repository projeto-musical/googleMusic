<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Músicos SENAI - Cadastrar Luthier</title>
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Arquivo de Estilos -->
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

    <!-- CABEÇALHO / NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-guitar"></i>
            <span>MÚSICOS SENAI</span>
        </div>
        <nav class="nav-links">
            <a href="/index.html" class="nav-btn"><i class="fa-solid fa-layer-group"></i> Instrumentos</a>
            <a href="/pages/cadastroInstrumento.html" class="nav-btn"><i class="fa-solid fa-plus"></i> Instrumento</a>
            <a href="/pages/cadastroMarca.html" class="nav-btn"><i class="fa-solid fa-tag"></i> Marca</a>
            <a href="/pages/cadastroLuthier.html" class="nav-btn active"><i class="fa-solid fa-wrench"></i> Luthier</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar Tema">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL (FORMULÁRIO LUTHIER) -->
    <main class="main-container">
        <div class="form-card">
            <div class="form-header">
                <h2><i class="fa-solid fa-wrench"></i> Cadastrar Luthier</h2>
                <p>Informe os dados do profissional de manutenção</p>
            </div>

            <form id="form-luthier">
                <input type="hidden" id="luthier-id">

                <div class="form-group">
                    <label for="luthier-nome">Nome Completo *</label>
                    <input type="text" id="luthier-nome" class="form-control" placeholder="Ex: João da Silva" required>
                </div>

                <div class="form-group">
                    <label for="luthier-telefone">Telefone *</label>
                    <input type="text" id="luthier-telefone" class="form-control" placeholder="Ex: (11) 99999-9999" required>
                </div>

                <div class="form-group">
                    <label for="luthier-especialidade">Especialidade *</label>
                    <input type="text" id="luthier-especialidade" class="form-control" placeholder="Ex: Instrumentos de Corda" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="resetForm('form-luthier')">
                        Limpar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-check"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- JS DO PROJETO -->
    <script src="/script/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÚSICOS SENAI - Novo Instrumento</title>
    <link rel="stylesheet" href="/Frontend/style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-guitar"></i>
                </div>
                <span>MÚSICOS <strong>SENAI</strong></span>
            </div>

            <nav class="nav-tabs">
                <a href="index.html" class="tab-btn">
                    <i class="fa-solid fa-layer-group"></i> Instrumentos
                </a>
                <a href="cadastroInstrumento.html" class="tab-btn active">
                    <i class="fa-solid fa-plus"></i> Instrumento
                </a>
                <a href="cadastroMarca.html" class="tab-btn">
                    <i class="fa-solid fa-tag"></i> Marca
                </a>
                <a href="cadastroLuthier.html" class="tab-btn">
                    <i class="fa-solid fa-screwdriver-wrench"></i> Luthier
                </a>
            </nav>

            <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()" title="Alternar Tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="main-wrapper">
        <section class="tab-content active-content">
            <div class="form-card">
                <div class="card-header">
                    <div class="card-icon"><i class="fa-solid fa-guitar"></i></div>
                    <div>
                        <h2>Cadastrar Instrumento</h2>
                        <p class="subtitle">Informe os dados para inclusão no catálogo</p>
                    </div>
                </div>
                
                <form id="form-instrumento">
                    <input type="hidden" id="inst-id" name="id">

                    <div class="form-group">
                        <label for="inst-nome">Nome / Modelo <span class="required">*</span></label>
                        <input type="text" id="inst-nome" name="nome" class="form-control" placeholder="Ex: Stratocaster Player" required>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="inst-familia">Família <span class="required">*</span></label>
                            <select id="inst-familia" name="familia" class="form-control" required>
                                <option value="">Selecione...</option>
                                <option value="CORDAS">Cordas</option>
                                <option value="SOPRO">Sopro</option>
                                <option value="PERCUSSAO">Percussão</option>
                                <option value="TECLAS">Teclas</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="inst-marca">Marca <span class="required">*</span></label>
                            <select id="inst-marca" name="marcaId" class="form-control" required>
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="inst-luthier">Luthier Responsável <span class="required">*</span></label>
                        <select id="inst-luthier" name="luthierId" class="form-control" required>
                            <option value="">Selecione...</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="resetForm('form-instrumento')">Limpar</button>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Salvar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="/Frontend/script/script.js"></script>
</body>
</html>

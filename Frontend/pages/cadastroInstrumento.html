<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Músicos SENAI - Cadastrar Instrumento</title>
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Arquivo de Estilos -->
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

    <!-- CABEÇALHO / NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-guitar"></i>
            <span>MÚSICOS SENAI</span>
        </div>
        <nav class="nav-links">
            <a href="/index.html" class="nav-btn"><i class="fa-solid fa-layer-group"></i> Instrumentos</a>
            <a href="/pages/cadastroInstrumento.html" class="nav-btn active"><i class="fa-solid fa-plus"></i> Instrumento</a>
            <a href="/pages/cadastroMarca.html" class="nav-btn"><i class="fa-solid fa-tag"></i> Marca</a>
            <a href="/pages/cadastroLuthier.html" class="nav-btn"><i class="fa-solid fa-wrench"></i> Luthier</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar Tema">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL (FORMULÁRIO) -->
    <main class="main-container">
        <div class="form-card">
            <div class="form-header">
                <h2><i class="fa-solid fa-guitar"></i> Cadastrar Instrumento</h2>
                <p>Informe os dados para inclusão no catálogo</p>
            </div>

            <form id="form-instrumento" onsubmit="cadastrarInstrumento(event)">
    <input type="hidden" id="inst-id">

    <div class="form-group">
        <label for="inst-nome">Nome / Modelo *</label>
        <input type="text" id="inst-nome" class="form-control" placeholder="Ex: Stratocaster Player" required>
    </div>

    <div class="form-group">
        <label for="inst-familia">Família *</label>
        <select id="inst-familia" class="form-control" required>
            <option value="">Selecione...</option>
            <option value="CORDAS">Cordas</option>
            <option value="SOPRO">Sopro</option>
            <option value="PERCUSSAO">Percussão</option>
            <option value="TECLAS">Teclas</option>
        </select>
    </div>

    <!-- Campo Novo Exigido pela Entidade Java -->
    <div class="form-group">
        <label for="inst-ano">Data de Fabricação *</label>
        <input type="date" id="inst-ano" class="form-control" required>
    </div>

    <div class="form-group">
        <label for="inst-descricao">Descrição</label>
        <input type="text" id="inst-descricao" class="form-control" placeholder="Ex: Guitarra em excelente estado">
    </div>

    <div class="form-group">
        <label for="inst-marca">Marca *</label>
        <select id="inst-marca" class="form-control" required>
            <option value="">Selecione...</option>
        </select>
    </div>

    <div class="form-group">
        <label for="inst-luthier">Luthier Responsável *</label>
        <select id="inst-luthier" class="form-control" required>
            <option value="">Selecione...</option>
        </select>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="resetForm('form-instrumento')">Limpar</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Salvar</button>
    </div>
</form>
        </div>
    </main>

    <!-- JS DO PROJETO -->
    <script src="/script/script.js"></script>
</body>
</html>

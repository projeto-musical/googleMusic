<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MÚSICOS SENAI - Catálogo</title>
    <link rel="stylesheet" href="./style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header">
        <div class="header-container">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-guitar"></i>
                </div>
                <span>MÚSICOS <strong>SENAI</strong></span>
            </div>

            <nav class="nav-tabs">
                <a href="/index.html" class="tab-btn">
                    <i class="fa-solid fa-layer-group"></i> Instrumentos
                </a>
                <a href="/pages/cadastroInstrumento.html" class="tab-btn active">
                    <i class="fa-solid fa-plus"></i> Instrumento
                </a>
                <a href="/pages/cadastroMarca.html" class="tab-btn">
                    <i class="fa-solid fa-tag"></i> Marca
                </a>
                <a href="/pages/cadastroLuthier.html" class="tab-btn">
                    <i class="fa-solid fa-screwdriver-wrench"></i> Luthier
                </a>
            </nav>

            <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()" title="Alternar Tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="main-wrapper">
        <section class="tab-content active-content">
            <div class="section-card">
                <div class="section-header">
                    <div>
                        <h2>Catálogo Geral</h2>
                        <p class="subtitle">Consulte e gerencie todos os instrumentos cadastrados</p>
                    </div>
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Filtrar registros..." class="form-control">
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome / Modelo</th>
                                <th>Família</th>
                                <th>Marca</th>
                                <th>Luthier</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="instrumentos-list">
                        </tbody>
                    </table>
                    <div id="empty-state" class="empty-state">
                        <i class="fa-solid fa-box-open"></i>
                        <p>Nenhum instrumento encontrado.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Músicos SENAI - Catálogo</title>
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Arquivo de Estilos -->
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

    <!-- CABEÇALHO / NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-guitar"></i>
            <span>MÚSICOS SENAI</span>
        </div>
        <nav class="nav-links">
            <a href="/index.html" class="nav-btn active"><i class="fa-solid fa-layer-group"></i> Instrumentos</a>
            <a href="/pages/cadastroInstrumento.html" class="nav-btn"><i class="fa-solid fa-plus"></i> Instrumento</a>
            <a href="/pages/cadastroMarca.html" class="nav-btn"><i class="fa-solid fa-tag"></i> Marca</a>
            <a href="/pages/cadastroLuthier.html" class="nav-btn"><i class="fa-solid fa-wrench"></i> Luthier</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Alternar Tema">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- TABELA DE INSTRUMENTOS -->
    <main class="table-container">
        <div class="table-card">
            <div class="table-header">
                <div>
                    <h2>Catálogo de Instrumentos</h2>
                    <p>Gerencie todos os instrumentos cadastrados no sistema</p>
                </div>
                <a href="/pages/cadastroInstrumento.html" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Novo Instrumento
                </a>
            </div>

            <!-- BUSCA/FILTRO -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" onkeyup="filtrarTabela()" placeholder="Buscar por modelo, família ou marca...">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th># ID</th>
                            <th>Nome / Modelo</th>
                            <th>Família</th>
                            <th>Marca</th>
                            <th>Luthier</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="instrumentos-list">
                        <!-- Conteúdo inserido dinamicamente via script.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- JS DO PROJETO -->
    <script src="/script/script.js"></script>
</body>
</html>
